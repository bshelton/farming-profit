plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.farmingprofit.FarmingProfitLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.farmingprofit'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.withType(Test).configureEach {
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            assert zip.getEntry('com/farmingprofit/FarmingProfitPlugin.class') != null
            assert zip.getEntry('com/farmingprofit/brand/mark-24.png') != null
            assert zip.getEntry('com/farmingprofit/brand/harvest-144.png') != null
            zip.entries().each { entry ->
                assert !entry.name.startsWith('META-INF/services/')
                assert !entry.name.contains('Launcher') && !entry.name.contains('Preview')
                assert !entry.name.contains('PerformanceProbe')
                assert !entry.name.endsWith('Test.class')
                if (entry.name.endsWith('.class')) {
                    zip.getInputStream(entry).withCloseable { stream ->
                        def input = new DataInputStream(stream)
                        input.readInt(); input.readUnsignedShort()
                        assert input.readUnsignedShort() == 55 : "Java 11 bytecode required: ${entry.name}"
                    }
                }
            }
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyReleaseJar') }

tasks.register('performanceCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.farmingprofit.PerformanceProbe'
    args layout.buildDirectory.dir('performance-fixture').get().asFile.absolutePath
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		jvmArgs '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
	args "--developer-mode", "--debug"
}

tasks.register('preview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.farmingprofit.SidebarPreview'
    args layout.buildDirectory.dir('preview').get().asFile.absolutePath
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
